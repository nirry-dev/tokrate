[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokrate"
version = "0.1.0"
description = "Benchmark a local, OpenAI-compatible LLM endpoint: time-to-first-token, tokens/sec, and throughput under concurrency. Pure standard library."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nirry", email = "labs@nirry.net" }]
keywords = [
    "llm",
    "benchmark",
    "openai",
    "tokens-per-second",
    "ttft",
    "throughput",
    "local-ai",
    "llama.cpp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://nirry.net"
Source = "https://github.com/nirry-dev/tokrate"
Issues = "https://github.com/nirry-dev/tokrate/issues"

[project.scripts]
tokrate = "tokrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tokrate"]

[tool.hatch.build.targets.sdist]
include = ["tokrate", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
